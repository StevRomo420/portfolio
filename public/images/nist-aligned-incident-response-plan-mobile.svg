<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="t d"><title id="t">NIST-aligned incident response plan mobile</title><desc id="d">Vertical response plan from preparation through continuous improvement.</desc><defs><style>.b{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.q{fill:#1d180d;stroke:#e6ad4c;stroke-width:2}.r{stroke:#294238;stroke-width:2}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#8fa99e}.o{fill:#e6ad4c}.l{font:500 17px ui-monospace,monospace;letter-spacing:1.5px}.h{font:600 25px Arial,sans-serif}.c{font:400 18px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace}</style></defs><rect class="b" width="720" height="1320"/><text x="42" y="58" class="l g">IR-004 / RESPONSE PLAN</text><text x="42" y="102" class="h w">NIST-Aligned operating model</text><line x1="42" y1="132" x2="678" y2="132" class="r"/>
<g transform="translate(42 166)"><rect class="p" width="636" height="154"/><text x="24" y="38" class="l g">01 / PREPARE</text><text x="24" y="80" class="h w">ROLES + READINESS</text><text x="24" y="119" class="c m">Reporting, telemetry and coordination</text></g><text x="360" y="351" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 378)"><rect class="a" width="636" height="154"/><text x="24" y="38" class="l g">02 / DETECT</text><text x="24" y="80" class="h w">DECLARE + SCOPE</text><text x="24" y="119" class="c m">Validate signals and confirm the incident</text></g><text x="360" y="563" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 590)"><rect class="q" width="636" height="154"/><text x="24" y="38" class="l o">03 / RESPOND</text><text x="24" y="80" class="h w">ANALYZE + CONTAIN</text><text x="24" y="119" class="c m">Coordinate bounded action and eradication</text></g><text x="360" y="775" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 802)"><rect class="p" width="636" height="154"/><text x="24" y="38" class="l g">04 / RECOVER</text><text x="24" y="80" class="h w">RESTORE + VALIDATE</text><text x="24" y="119" class="c m">Return systems and services to operation</text></g><text x="360" y="987" text-anchor="middle" class="h o">↓</text>
<g transform="translate(42 1014)"><rect class="p" width="636" height="154"/><text x="24" y="38" class="l o">05 / IMPROVE</text><text x="24" y="80" class="h w">LESSONS + CONTROLS</text><text x="24" y="119" class="c m">Feed outcomes back into preparation</text></g><text x="42" y="1232" class="l g">CONTINUOUS IMPROVEMENT</text><text x="42" y="1270" class="s m">PREPARE / DETECT / RESPOND / RECOVER</text><text x="42" y="1298" class="s m">NIST-ALIGNED RESPONSE WORKFLOW</text></svg>
