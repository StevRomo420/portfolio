<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">Cyber risk assurance lifecycle mobile</title><desc id="desc">Vertical risk lifecycle from identification through follow-up.</desc><defs><style>.bg{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.r{stroke:#294238;stroke-width:2}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#9db0a7}.l{font:500 17px ui-monospace,monospace;letter-spacing:1.5px}.h{font:600 25px Arial,sans-serif}.c{font:400 18px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace}</style></defs><rect class="bg" width="720" height="1280"/><text x="42" y="58" class="l g">GRC-005 / ASSURANCE</text><text x="42" y="102" class="h w">Risk treatment lifecycle</text><line x1="42" y1="132" x2="678" y2="132" class="r"/>
<g transform="translate(42 166)"><rect class="p" width="636" height="155"/><text x="24" y="40" class="l g">01 / IDENTIFY</text><text x="24" y="82" class="h w">SET CONTEXT</text><text x="24" y="122" class="c m">Assets, scenarios and scope</text></g><text x="360" y="360" text-anchor="middle" class="h g">↓</text><g transform="translate(42 390)"><rect class="p" width="636" height="155"/><text x="24" y="40" class="l g">02 / ASSESS</text><text x="24" y="82" class="h w">RATE RISK</text><text x="24" y="122" class="c m">Likelihood, impact and controls</text></g><text x="360" y="584" text-anchor="middle" class="h g">↓</text><g transform="translate(42 614)"><rect class="a" width="636" height="155"/><text x="24" y="40" class="l g">03 / PRIORITIZE</text><text x="24" y="82" class="h w">MAKE EXPOSURE VISIBLE</text><text x="24" y="122" class="c m">Order work by decision value</text></g><text x="360" y="808" text-anchor="middle" class="h g">↓</text><g transform="translate(42 838)"><rect class="p" width="636" height="155"/><text x="24" y="40" class="l g">04 / TREAT</text><text x="24" y="82" class="h w">ASSIGN ACTION</text><text x="24" y="122" class="c m">Owner, response and target state</text></g><text x="360" y="1032" text-anchor="middle" class="h g">↓</text><g transform="translate(42 1062)"><rect class="p" width="636" height="155"/><text x="24" y="40" class="l g">05 / FOLLOW UP</text><text x="24" y="82" class="h w">VERIFY AND CLOSE</text><text x="24" y="122" class="c m">Evidence feeds the next review</text></g><text x="42" y="1255" class="s m">RISK OWNERSHIP / TREATMENT / FOLLOW-UP</text></svg>
