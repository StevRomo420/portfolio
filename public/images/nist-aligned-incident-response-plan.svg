<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="t d"><title id="t">NIST-aligned incident response plan</title><desc id="d">Operating model connecting preparation, detection, coordinated response, recovery and continuous improvement.</desc><defs><style>.b{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.q{fill:#1d180d;stroke:#e6ad4c;stroke-width:2}.r{stroke:#294238;stroke-width:2}.f{stroke:#72d69b;stroke-width:3;fill:none}.z{stroke:#e6ad4c;stroke-width:3;fill:none;stroke-dasharray:8 8}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#8fa99e}.o{fill:#e6ad4c}.l{font:500 17px ui-monospace,monospace;letter-spacing:2px}.h{font:600 26px Arial,sans-serif}.c{font:400 17px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace;letter-spacing:1px}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72d69b"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e6ad4c"/></marker></defs><rect class="b" width="1600" height="840"/><text x="80" y="76" class="l g">IR-004 / RESPONSE OPERATING MODEL</text><text x="80" y="124" class="h w">NIST-Aligned Incident Response Plan</text><text x="1520" y="76" text-anchor="end" class="s m">CSF 2.0-ALIGNED WORKFLOW</text><line x1="80" y1="158" x2="1520" y2="158" class="r"/>
<g transform="translate(80 250)"><rect class="p" width="250" height="220"/><text x="24" y="42" class="l g">01 / PREPARE</text><text x="24" y="90" class="h w">ESTABLISH</text><text x="24" y="132" class="c m">Roles, reporting,</text><text x="24" y="165" class="c m">telemetry and readiness</text><text x="24" y="198" class="s m">GOVERN · IDENTIFY · PROTECT</text></g><path d="M330 360h60" class="f" marker-end="url(#x)"/>
<g transform="translate(400 250)"><rect class="a" width="250" height="220"/><text x="24" y="42" class="l g">02 / DETECT</text><text x="24" y="90" class="h w">DECLARE</text><text x="24" y="132" class="c m">Validate signals</text><text x="24" y="165" class="c m">and determine scope</text><text x="24" y="198" class="s g">INCIDENT CONFIRMED</text></g><path d="M650 360h60" class="f" marker-end="url(#x)"/>
<g transform="translate(720 250)"><rect class="q" width="250" height="220"/><text x="24" y="42" class="l o">03 / RESPOND</text><text x="24" y="90" class="h w">COORDINATE</text><text x="24" y="132" class="c m">Analyze, contain</text><text x="24" y="165" class="c m">and eradicate</text><text x="24" y="198" class="s o">BOUNDED ACTION</text></g><path d="M970 360h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1040 250)"><rect class="p" width="250" height="220"/><text x="24" y="42" class="l g">04 / RECOVER</text><text x="24" y="90" class="h w">RESTORE</text><text x="24" y="132" class="c m">Systems, services</text><text x="24" y="165" class="c m">and trusted operations</text><text x="24" y="198" class="s g">VALIDATE RETURN</text></g><path d="M1290 360h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1360 250)"><rect class="p" width="160" height="220"/><text x="20" y="42" class="l g">05</text><text x="20" y="90" class="h w" style="font-size:22px">IMPROVE</text><text x="20" y="132" class="c m">Lessons</text><text x="20" y="165" class="c m">and controls</text></g>
<path d="M1440 500v110H205V480" class="z" marker-end="url(#y)"/><text x="800" y="646" text-anchor="middle" class="l o">CONTINUOUS IMPROVEMENT RETURNS TO PREPARATION</text><rect x="80" y="690" width="1440" height="74" class="p"/><text x="108" y="734" class="c w">Inputs: monitoring · user reports · threat intelligence · third parties</text><text x="80" y="808" class="s m">PREPARE / DETECT / RESPOND / RECOVER / IMPROVE</text></svg>
