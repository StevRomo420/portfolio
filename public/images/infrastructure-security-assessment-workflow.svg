<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Infrastructure security assessment workflow</title><desc id="desc">A five-stage technical assessment workflow from scope through improvement.</desc><defs><style>.bg{fill:#07100d}.panel{fill:#0a1511;stroke:#294238;stroke-width:2}.active{fill:#10291e;stroke:#72d69b;stroke-width:2}.rule{stroke:#294238;stroke-width:2}.flow{stroke:#72d69b;stroke-width:3;fill:none}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#9db0a7}.l{font:500 17px ui-monospace,monospace;letter-spacing:2px}.h{font:600 25px Arial,sans-serif}.c{font:400 17px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace;letter-spacing:1px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72d69b"/></marker></defs><rect class="bg" width="1600" height="760"/><text x="80" y="72" class="l g">ASM-006 / TECHNICAL ASSESSMENT</text><text x="80" y="120" class="h w">Evidence that infrastructure teams can act on</text><text x="1520" y="72" text-anchor="end" class="s m">IDENTITY / WIRELESS</text><line x1="80" y1="154" x2="1520" y2="154" class="rule"/>
<g transform="translate(80 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="l g">01 / SCOPE</text><text x="24" y="86" class="h w">SET BOUNDARIES</text><text x="24" y="128" class="c m">Objective, systems</text><text x="24" y="158" class="c m">and safe conditions</text></g><path d="M330 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(400 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="l g">02 / ASSESS</text><text x="24" y="86" class="h w">TEST CONTROLS</text><text x="24" y="128" class="c m">Controlled review of</text><text x="24" y="158" class="c m">relevant exposure</text></g><path d="M650 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(720 230)"><rect class="active" width="250" height="210"/><text x="24" y="42" class="l g">03 / VALIDATE</text><text x="24" y="86" class="h w">CHECK EVIDENCE</text><text x="24" y="128" class="c m">Confirm impact and</text><text x="24" y="158" class="c m">remove uncertainty</text></g><path d="M970 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(1040 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="l g">04 / REPORT</text><text x="24" y="86" class="h w">EXPLAIN RISK</text><text x="24" y="128" class="c m">Clear priority and</text><text x="24" y="158" class="c m">practical next step</text></g><path d="M1290 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(1360 230)"><rect class="panel" width="160" height="210"/><text x="20" y="42" class="l g">05</text><text x="20" y="86" class="h w">IMPROVE</text><text x="20" y="128" class="c m">Remediate</text><text x="20" y="158" class="c m">and retest</text></g>
<rect x="80" y="520" width="1440" height="120" class="panel"/><text x="108" y="566" class="l g">OPERATING PRINCIPLE</text><text x="108" y="609" class="h w">Test only what is in scope. Report only what can be supported by evidence.</text><text x="80" y="710" class="s m">SCOPE / EVIDENCE / REMEDIATION / RETEST</text></svg>
