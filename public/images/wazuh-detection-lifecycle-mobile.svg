<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="t d"><title id="t">Wazuh detection lifecycle mobile</title><desc id="d">Vertical controlled detection lifecycle.</desc><defs><style>.b{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.r{stroke:#294238;stroke-width:2}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#8fa99e}.o{fill:#e6ad4c}.l{font:500 17px ui-monospace,monospace;letter-spacing:1.5px}.h{font:600 25px Arial,sans-serif}.c{font:400 18px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace}</style></defs><rect class="b" width="720" height="1320"/><text x="42" y="58" class="l g">LAB-003 / WAZUH</text><text x="42" y="102" class="h w">Detection validation path</text><line x1="42" y1="132" x2="678" y2="132" class="r"/>
<g transform="translate(42 170)"><rect class="p" width="636" height="160"/><text x="24" y="38" class="l g">01 / TELEMETRY</text><text x="24" y="80" class="h w">GENERATE CONTROLLED EVENTS</text><text x="24" y="121" class="c m">Known input and simulated traffic</text></g><text x="360" y="365" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 395)"><rect class="p" width="636" height="160"/><text x="24" y="38" class="l g">02 / PARSE</text><text x="24" y="80" class="h w">NORMALIZE TELEMETRY</text><text x="24" y="121" class="c m">Decoder and field inspection</text></g><text x="360" y="590" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 620)"><rect class="a" width="636" height="160"/><text x="24" y="38" class="l g">03 / DETECT</text><text x="24" y="80" class="h w">CORRELATE SIGNAL</text><text x="24" y="121" class="c m">Rules, severity and context</text></g><text x="360" y="815" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 845)"><rect class="p" width="636" height="160"/><text x="24" y="38" class="l g">04 / VALIDATE</text><text x="24" y="80" class="h w">TUNE AND REVIEW NOISE</text><text x="24" y="121" class="c m">Quality gate before promotion</text></g><text x="360" y="1040" text-anchor="middle" class="h g">↓</text>
<g transform="translate(42 1070)"><rect class="p" width="636" height="160"/><text x="24" y="38" class="l g">05 / PROMOTE</text><text x="24" y="80" class="h w">CONTROLLED ROLLOUT</text><text x="24" y="121" class="c m">Feedback returns to tuning</text></g><text x="42" y="1284" class="s m">LAB VIEW / PRODUCTION IDENTIFIERS OMITTED</text></svg>
