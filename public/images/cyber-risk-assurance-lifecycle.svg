<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Cyber risk and security assurance lifecycle</title><desc id="desc">A five-stage lifecycle to identify, assess, prioritize, treat and follow up security risk.</desc><defs><style>.bg{fill:#07100d}.panel{fill:#0a1511;stroke:#294238;stroke-width:2}.active{fill:#10291e;stroke:#72d69b;stroke-width:2}.rule{stroke:#294238;stroke-width:2}.flow{stroke:#72d69b;stroke-width:3;fill:none}.white{fill:#edf5f1}.green{fill:#72d69b}.muted{fill:#9db0a7}.label{font:500 17px ui-monospace,monospace;letter-spacing:2px}.heading{font:600 25px Arial,sans-serif}.copy{font:400 17px Arial,sans-serif}.small{font:500 14px ui-monospace,monospace;letter-spacing:1px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72d69b"/></marker></defs><rect class="bg" width="1600" height="760"/><text x="80" y="72" class="label green">GRC-005 / SECURITY ASSURANCE</text><text x="80" y="120" class="heading white">Risk decisions with a visible path to closure</text><text x="1520" y="72" text-anchor="end" class="small muted">RISK MANAGEMENT WORKFLOW</text><line x1="80" y1="154" x2="1520" y2="154" class="rule"/>
<g transform="translate(80 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="label green">01 / IDENTIFY</text><text x="24" y="86" class="heading white">SET CONTEXT</text><text x="24" y="128" class="copy muted">Assets, scenarios</text><text x="24" y="158" class="copy muted">and control scope</text></g><path d="M330 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(400 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="label green">02 / ASSESS</text><text x="24" y="86" class="heading white">RATE RISK</text><text x="24" y="128" class="copy muted">Likelihood, impact</text><text x="24" y="158" class="copy muted">and control review</text></g><path d="M650 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(720 230)"><rect class="active" width="250" height="210"/><text x="24" y="42" class="label green">03 / PRIORITIZE</text><text x="24" y="86" class="heading white">MAKE VISIBLE</text><text x="24" y="128" class="copy muted">Rank exposure and</text><text x="24" y="158" class="copy muted">support decisions</text></g><path d="M970 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(1040 230)"><rect class="panel" width="250" height="210"/><text x="24" y="42" class="label green">04 / TREAT</text><text x="24" y="86" class="heading white">ASSIGN ACTION</text><text x="24" y="128" class="copy muted">Owner, response</text><text x="24" y="158" class="copy muted">and target state</text></g><path d="M1290 335h60" class="flow" marker-end="url(#arrow)"/><g transform="translate(1360 230)"><rect class="panel" width="160" height="210"/><text x="20" y="42" class="label green">05</text><text x="20" y="86" class="heading white">FOLLOW UP</text><text x="20" y="128" class="copy muted">Verify and</text><text x="20" y="158" class="copy muted">close</text></g>
<rect x="80" y="520" width="1440" height="120" class="panel"/><text x="108" y="566" class="label green">ASSURANCE OUTPUT</text><text x="108" y="609" class="heading white">A documented decision, accountable treatment and evidence of progress.</text><text x="80" y="710" class="small muted">RISK OWNERSHIP / TREATMENT / FOLLOW-UP</text></svg>
