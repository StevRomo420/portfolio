<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="t d"><title id="t">Mixed-infrastructure incident response triage</title><desc id="d">Windows and Linux evidence workflow through acquisition, triage, correlation, containment and reporting.</desc><defs><style>.b{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.r{stroke:#294238;stroke-width:2}.f{stroke:#72d69b;stroke-width:3;fill:none}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#8fa99e}.o{fill:#e6ad4c}.l{font:500 17px ui-monospace,monospace;letter-spacing:2px}.h{font:600 26px Arial,sans-serif}.c{font:400 17px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace;letter-spacing:1px}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72d69b"/></marker></defs><rect class="b" width="1600" height="840"/><text x="80" y="76" class="l g">IR-004 / MIXED INFRASTRUCTURE</text><text x="80" y="124" class="h w">Evidence to defensible response</text><text x="1520" y="76" text-anchor="end" class="s m">WINDOWS + LINUX / TECHNICAL TRIAGE</text><line x1="80" y1="158" x2="1520" y2="158" class="r"/>
<g transform="translate(80 245)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">01 / ACQUIRE</text><text x="24" y="90" class="h w">COLLECT</text><text x="24" y="132" class="c m">Host and service logs</text><text x="24" y="165" class="c m">process + network state</text><text x="24" y="200" class="s o">PRESERVE CONTEXT</text></g><path d="M330 357h60" class="f" marker-end="url(#x)"/>
<g transform="translate(400 245)"><rect class="a" width="250" height="224"/><text x="24" y="42" class="l g">02 / TRIAGE</text><text x="24" y="90" class="h w">PRIORITIZE</text><text x="24" y="132" class="c m">Artifacts, identity</text><text x="24" y="165" class="c m">and initial scope</text><text x="24" y="200" class="s g">FAST SIGNAL</text></g><path d="M650 357h60" class="f" marker-end="url(#x)"/>
<g transform="translate(720 245)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">03 / CORRELATE</text><text x="24" y="90" class="h w">RECONSTRUCT</text><text x="24" y="132" class="c m">Cross-host timeline</text><text x="24" y="165" class="c m">and causal sequence</text><text x="24" y="200" class="s m">EXPLAIN THE EVENT</text></g><path d="M970 357h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1040 245)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">04 / CONTAIN</text><text x="24" y="90" class="h w">ACT</text><text x="24" y="132" class="c m">Bounded response</text><text x="24" y="165" class="c m">based on evidence</text><text x="24" y="200" class="s o">LIMIT IMPACT</text></g><path d="M1290 357h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1360 245)"><rect class="p" width="160" height="224"/><text x="20" y="42" class="l g">05</text><text x="20" y="90" class="h w" style="font-size:23px">REPORT</text><text x="20" y="132" class="c m">Findings</text><text x="20" y="165" class="c m">and actions</text></g>
<rect x="80" y="558" width="1440" height="168" class="p"/><text x="108" y="606" class="l g">EVIDENCE SOURCES</text><text x="108" y="654" class="h w">WINDOWS</text><text x="108" y="690" class="c m">Event logs · registry · services · PowerShell</text><text x="800" y="654" class="h w">LINUX</text><text x="800" y="690" class="c m">Journal · auth logs · processes · services</text><text x="80" y="792" class="s m">SANITIZED WORKFLOW / IDENTIFIERS AND INTERNAL TOOLING OMITTED</text></svg>
