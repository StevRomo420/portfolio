<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="t d"><title id="t">Wazuh detection lifecycle</title><desc id="d">Controlled lifecycle from telemetry through parsing, detection, validation and promotion.</desc>
<defs><style>.b{fill:#07100d}.p{fill:#0a1511;stroke:#294238;stroke-width:2}.a{fill:#10291e;stroke:#72d69b;stroke-width:2}.r{stroke:#294238;stroke-width:2}.f{stroke:#72d69b;stroke-width:3;fill:none}.w{fill:#edf5f1}.g{fill:#72d69b}.m{fill:#8fa99e}.o{fill:#e6ad4c}.l{font:500 17px ui-monospace,monospace;letter-spacing:2px}.h{font:600 27px Arial,sans-serif}.c{font:400 17px Arial,sans-serif}.s{font:500 14px ui-monospace,monospace;letter-spacing:1px}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72d69b"/></marker></defs>
<rect class="b" width="1600" height="840"/><text x="80" y="76" class="l g">LAB-003 / DETECTION ENGINEERING</text><text x="80" y="124" class="h w">From controlled telemetry to production-ready detection</text><text x="1520" y="76" text-anchor="end" class="s m">WAZUH / VALIDATION PATH</text><line x1="80" y1="158" x2="1520" y2="158" class="r"/>
<g transform="translate(80 244)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">01 / TELEMETRY</text><text x="24" y="90" class="h w">GENERATE</text><text x="24" y="132" class="c m">Controlled events</text><text x="24" y="165" class="c m">and attack traffic</text><text x="24" y="200" class="s m">KNOWN INPUT</text></g><path d="M330 356h60" class="f" marker-end="url(#x)"/>
<g transform="translate(400 244)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">02 / PARSE</text><text x="24" y="90" class="h w">NORMALIZE</text><text x="24" y="132" class="c m">Inspect decoders</text><text x="24" y="165" class="c m">and extracted fields</text><text x="24" y="200" class="s m">TRUST THE DATA</text></g><path d="M650 356h60" class="f" marker-end="url(#x)"/>
<g transform="translate(720 244)"><rect class="a" width="250" height="224"/><text x="24" y="42" class="l g">03 / DETECT</text><text x="24" y="90" class="h w">CORRELATE</text><text x="24" y="132" class="c m">Rules, severity</text><text x="24" y="165" class="c m">and context</text><text x="24" y="200" class="s g">SIGNAL CREATED</text></g><path d="M970 356h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1040 244)"><rect class="p" width="250" height="224"/><text x="24" y="42" class="l g">04 / VALIDATE</text><text x="24" y="90" class="h w">TUNE</text><text x="24" y="132" class="c m">Expected match</text><text x="24" y="165" class="c m">and noise review</text><text x="24" y="200" class="s o">QUALITY GATE</text></g><path d="M1290 356h60" class="f" marker-end="url(#x)"/>
<g transform="translate(1360 244)"><rect class="p" width="160" height="224"/><text x="20" y="42" class="l g">05</text><text x="20" y="90" class="h w">PROMOTE</text><text x="20" y="132" class="c m">Controlled</text><text x="20" y="165" class="c m">rollout</text><text x="20" y="200" class="s g">READY</text></g>
<rect x="80" y="556" width="1440" height="170" class="p"/><text x="108" y="604" class="l g">FEEDBACK LOOP</text><text x="108" y="651" class="h w">Observed noise and missed context return to parsing and rule tuning.</text><text x="108" y="688" class="c m">The lab reduces production risk by making every detection explainable and repeatable before rollout.</text><text x="80" y="792" class="s m">DETECTION ENGINEERING / VALIDATION / CONTROLLED ROLLOUT</text></svg>
